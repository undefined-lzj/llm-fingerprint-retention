[project]
name = "llm-fingerprint-retention"
version = "0.1.0"
description = "语言模型主动指令指纹在部署变换后的保持与黑盒验证"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.0,<2.0",
    "huggingface-hub>=0.30,<2.0",
    "peft>=0.21,<0.22",
    "psutil>=5.9,<8.0",
    "safetensors>=0.4.5,<1.0",
    "torch>=2.7,<3.0",
    "transformers>=4.51.0,<5.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
